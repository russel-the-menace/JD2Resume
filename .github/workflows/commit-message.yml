name: Commit message

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail
          git log --format=%H "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | while read -r commit; do
                git show -s --format=%B "$commit" > /tmp/commit-message.txt
                node scripts/validate-commit-message.mjs /tmp/commit-message.txt
              done
