services:
  postgres:
    image: postgres:16-alpine
    container_name: jd2resume-postgres
    restart: unless-stopped
    env_file:
      - .env
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    ports:
      - "127.0.0.1:${JD2RESUME_DB_PORT:-55432}:5432"
    volumes:
      - jd2resume_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    cpus: 0.5

volumes:
  jd2resume_postgres_data:
    name: jd2resume_postgres_data
